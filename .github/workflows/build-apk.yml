name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        run: |
          grep -nE "^e: |What went wrong|FAILURE|error:" -A4 build.log | head -60 || true
          echo "-----"
          tail -30 build.log

      - uses: actions/upload-artifact@v4
        with:
          name: PdfReader-apk
          path: app/build/outputs/apk/debug/app-debug.apk
